<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JSON to Dynamic Table</title>
  <!-- jQuery CDN included for $.getJSON functionality -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
    th { background-color: #f4f4f4; }
    button { padding: 8px 16px; margin-right: 8px; cursor: pointer; }
  </style>
</head>
<body>

  <h2>Load JSON into Table</h2>
  <button onclick="loadWithFetch()">Load using fetch()</button>
  <button onclick="loadWithJQuery()">Load using $.getJSON()</button>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
      </tr>
    </thead>
    <tbody id="table-body">
      <!-- Dynamic rows load here -->
    </tbody>
  </table>

  <script>
    const apiUrl = 'https://jsonplaceholder.typicode.com/users';

    // Helper function to build and inject rows
    function renderRows(data) {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = ''; // Clear table
      
      data.forEach(user => {
        const row = `<tr>
          <td>${user.id}</td>
          <td>${user.name}</td>
          <td>${user.email}</td>
        </tr>`;
        tbody.innerHTML += row;
      });
    }

    // 1. Vanilla JS fetch() implementation
    async function loadWithFetch() {
      try {
        const response = await fetch(apiUrl);
        const data = await response.json();
        renderRows(data);
      } catch (err) {
        console.error('Fetch error:', err);
      }
    }

    // 2. jQuery $.getJSON() implementation
    function loadWithJQuery() {
      $.getJSON(apiUrl, function(data) {
        renderRows(data);
      }).fail(function(err) {
        console.error('jQuery error:', err);
      });
    }
  </script>

</body>
</html>
